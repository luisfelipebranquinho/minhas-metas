<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Metas</title>
<meta name="theme-color" content="#2F6B4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Metas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">

<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1EA; --card:#FFFDF8; --ink:#1E2A24; --muted:#6E7A72; --line:#E3DED2;
  --accent:#2F6B4F; --accent-ink:#fff; --accent-soft:#DDEBE2;
  --miss:#B4543A; --miss-soft:#F3DFD7; --today:#D98E04; --today-soft:#FBEBC8;
  --shadow:0 1px 2px rgba(30,42,36,.06),0 6px 20px rgba(30,42,36,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121714;--card:#1A211D;--ink:#ECEFE9;--muted:#93A098;--line:#2A332E;
  --accent:#5DBB8A;--accent-ink:#0E1511;--accent-soft:#1F3529;
  --miss:#E58A70;--miss-soft:#3A2520;--today:#F2B544;--today-soft:#3A2F17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:16px}
body{min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:560px;margin:0 auto;padding:20px 18px 60px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;margin:0;letter-spacing:-.01em}
h1{font-size:34px;line-height:1.1}
h2{font-size:26px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--miss);color:#fff}
.btn[disabled]{opacity:.5}
.link{color:var(--accent);font-weight:700;padding:6px 0}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.err{color:var(--miss);font-weight:600;font-size:14px;margin-top:12px;min-height:1em}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:10px}
.back{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--muted);padding:8px 0}
.pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}

/* login */
.auth{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.logo{width:58px;height:58px;border-radius:18px;background:var(--accent);display:grid;place-items:center;margin-bottom:22px}
.auth h1{margin-bottom:8px}

/* home */
.bigmenu{display:flex;align-items:center;gap:16px;padding:22px;margin-top:8px;width:100%;text-align:left}
.bigmenu .ic{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.bigmenu h3{font-size:24px}
.chev{margin-left:auto;color:var(--muted)}
.today-list{margin-top:22px}
.today-list h3{font-family:Manrope,system-ui,sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.trow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.dot{width:10px;height:10px;border-radius:99px;flex:none}

/* list */
.metas{display:flex;flex-direction:column;gap:12px}
.mcard{width:100%;text-align:left;display:block}
.mhead{display:flex;align-items:flex-start;gap:12px}
.memo{font-size:28px;line-height:1}
.mtitle{font-weight:800;font-size:17px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:14px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.mfoot{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--muted);font-weight:600}
.empty{text-align:center;padding:40px 20px}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px rgba(47,107,79,.35);display:grid;place-items:center}

/* detail */
.hero{display:flex;gap:18px;align-items:center}
.ring{position:relative;width:110px;height:110px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring b{font-family:Fraunces;font-size:28px;display:block;line-height:1}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:16px}
.stat{background:var(--bg);border-radius:14px;padding:11px 4px;text-align:center;min-width:0}
.stat b{display:block;font-size:21px;font-family:Fraunces,Georgia,serif;white-space:nowrap}
.stat span{font-size:11px;color:var(--muted);font-weight:600;line-height:1.2;display:block}
.punch{margin-top:16px;padding:20px;font-size:18px;border-radius:18px}
.punch.done{background:var(--accent-soft);color:var(--accent)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:18px}
.wk>div{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding-bottom:2px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:6px}
.day{aspect-ratio:1;min-width:0;padding:0;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:15px;position:relative;background:var(--bg);color:var(--muted);border:2px solid transparent}
.day small{font-size:9px;font-weight:700;opacity:.8;line-height:1;margin-top:2px}
.day.done{background:var(--accent);color:var(--accent-ink)}
.day.miss{background:var(--miss-soft);color:var(--miss)}
.day.vac{background:repeating-linear-gradient(135deg,var(--miss) 0 5px,#8f3a26 5px 10px);color:#fff}
.day.today.vac{background:repeating-linear-gradient(135deg,var(--miss) 0 5px,#8f3a26 5px 10px);color:#fff}
.vacilei{display:block;margin:10px auto 0;padding:10px 18px;border-radius:12px;font-weight:800;font-size:14px;color:var(--miss);border:1.5px dashed var(--miss)}
.day.today{border-color:var(--today);background:var(--today-soft);color:var(--ink)}
.day.today.done{background:var(--accent);color:var(--accent-ink)}
.day.future{opacity:.55}
.day.out{visibility:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted);font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.motivo{margin-top:14px;padding:14px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 12px 12px 0;font-style:italic}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,15,12,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s ease-out}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:14px 10px;border-radius:14px;border:1.5px solid var(--line);font-weight:700;text-align:left}
.seg button small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:3px}
.seg button.on{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);font-weight:700;font-size:14px}
.chips button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.emojis{display:flex;gap:6px;flex-wrap:wrap}
.emojis button{width:44px;height:44px;border-radius:12px;font-size:22px;border:1.5px solid var(--line)}
.emojis button.on{border-color:var(--accent);background:var(--accent-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:20;animation:up .2s}
.bloqueio{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(circle at 50% 30%,#1d3a2c,#0b1510 70%);color:#fff}
.bloqueio h1{font-size:30px;margin-top:14px}
.bloqueio p{max-width:380px;margin:12px auto 0;opacity:.85;line-height:1.5}
.bloqueio .end{display:inline-block;margin-top:18px;padding:10px 16px;border-radius:12px;background:rgba(255,255,255,.1);font-weight:800;letter-spacing:.02em}
.bloqueio.alerta{background:radial-gradient(circle at 50% 30%,#4a1610,#120504 70%)}
.loading{min-height:70vh;display:grid;place-items:center;text-align:center}
.spin{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:99px;animation:spin 1s linear infinite;margin:0 auto 14px}
/* medalhas */
.celebra{position:fixed;inset:0;z-index:30;background:radial-gradient(circle at 50% 38%,#3a2c0c 0%,#120e06 45%,#050505 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;overflow:hidden;animation:fade .35s;padding:20px}
.rays{position:absolute;width:1100px;height:1100px;left:50%;top:38%;margin:-550px 0 0 -550px;background:repeating-conic-gradient(from 0deg,rgba(255,206,110,.20) 0deg 7deg,transparent 7deg 18deg);animation:spin 24s linear infinite;-webkit-mask:radial-gradient(circle,#000 8%,transparent 55%);mask:radial-gradient(circle,#000 8%,transparent 55%);pointer-events:none}
.glow{position:absolute;width:420px;height:420px;left:50%;top:38%;margin:-210px 0 0 -210px;border-radius:50%;background:radial-gradient(circle,var(--glow,rgba(255,200,90,.55)) 0%,transparent 65%);animation:pulse 2.4s ease-in-out infinite;pointer-events:none}
.stage{perspective:900px;position:relative;z-index:2}
.medal-in{animation:medalIn 1.9s cubic-bezier(.18,.9,.25,1) both;transform-style:preserve-3d;filter:drop-shadow(0 24px 40px rgba(0,0,0,.7)) drop-shadow(0 0 26px rgba(255,200,90,.35))}
.medal-in>.floaty{animation:floaty 3.4s ease-in-out 1.9s infinite}
@keyframes medalIn{0%{transform:translateY(-110vh) rotateY(0) scale(.5)}55%{transform:translateY(24px) rotateY(1000deg) scale(1.12)}75%{transform:translateY(-10px) rotateY(1080deg) scale(.98)}100%{transform:translateY(0) rotateY(1080deg) scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-10px) rotate(1.5deg)}}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.8}50%{transform:scale(1.1);opacity:1}}
.c-kicker{position:relative;z-index:2;margin-top:18px;font-weight:800;font-size:12px;letter-spacing:.32em;color:#F4D27A;opacity:0;animation:show .6s 1.5s forwards}
.c-title{position:relative;z-index:2;font-family:Fraunces,serif;font-size:40px;font-weight:700;line-height:1.05;margin-top:8px;background:linear-gradient(180deg,#FFF6D6,#F1C24E 55%,#B07A1A);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:show .6s 1.7s forwards}
.c-sub{position:relative;z-index:2;color:#d8d2c2;margin-top:8px;font-weight:600;opacity:0;animation:show .6s 1.9s forwards;max-width:340px}
.c-btn{position:relative;z-index:2;margin-top:26px;padding:15px 28px;border-radius:16px;background:linear-gradient(180deg,#F7D774,#C9921F);color:#2a1c00;font-weight:800;opacity:0;animation:show .6s 2.2s forwards;box-shadow:0 8px 30px rgba(240,190,70,.35)}
.confete{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;z-index:3;pointer-events:none;animation:cair linear forwards}
@keyframes cair{to{transform:translateY(115vh) rotate(var(--r,720deg))}}
.spark{position:absolute;z-index:3;width:14px;height:14px;pointer-events:none;animation:twinkle 1.8s ease-in-out infinite}
.spark::before,.spark::after{content:"";position:absolute;left:50%;top:50%;background:#FFF3C4;border-radius:2px;transform:translate(-50%,-50%)}
.spark::before{width:2px;height:14px}.spark::after{width:14px;height:2px}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.medgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.medcell{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px 10px 16px;text-align:center;display:flex;flex-direction:column;align-items:center}
.medcell.lock svg{filter:grayscale(1) brightness(.55) contrast(.9);opacity:.45}
.medcell b{font-size:14px;margin-top:6px}
.medcell span{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.medbadge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:4px 9px;border-radius:99px;background:linear-gradient(180deg,#FFF1B8,#E2B13C);color:#4a3000}
.v3d{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 40%,#3a2c0c 0%,#120e06 50%,#050505 85%);color:#fff;animation:fade .25s;overflow:hidden}
.v3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}
.v3d .topo{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;pointer-events:none}
.v3d .topo>*{pointer-events:auto}
.v3d .fechar3d{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-size:20px;font-weight:800}
.v3d .rodape{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:14px 20px calc(18px + env(safe-area-inset-bottom));text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.65));pointer-events:none}
.v3d .rodape b{font-family:Fraunces,serif;font-size:26px;display:block;background:linear-gradient(180deg,#FFF6D6,#F1C24E 55%,#B07A1A);-webkit-background-clip:text;background-clip:text;color:transparent}
.v3d .rodape p{font-size:13px;opacity:.8;margin-top:4px;font-weight:600}
.v3d .rodape button{pointer-events:auto;margin-top:10px;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:13px}
.v3d .cad{position:absolute;inset:0;z-index:2;display:grid;place-items:center;text-align:center;pointer-events:none}
.v3d .marca{z-index:2}
.cadeado{display:inline-block;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.14);font-size:12px;font-weight:800;letter-spacing:.06em}
.protegido,.protegido *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.protegido svg{pointer-events:none}
.vitrine{position:relative;overflow:hidden;border-radius:24px;padding:18px 14px 22px;background:radial-gradient(circle at 50% 0%,#3a2c0c,#120e06 60%,#050505);color:#fff;margin-top:12px}
.vitrine .medcell{background:rgba(255,255,255,.06);box-shadow:none;color:#fff}
.vitrine .medcell span{color:rgba(255,255,255,.6)}
.vitrine .medcell b.muted{color:rgba(255,255,255,.5)}
.marca{position:absolute;inset:-50%;pointer-events:none;z-index:0;display:flex;flex-wrap:wrap;gap:40px 60px;transform:rotate(-24deg);opacity:.07;font-weight:800;font-size:13px;letter-spacing:.15em;color:#fff;align-content:flex-start}
.vitrine>*:not(.marca){position:relative;z-index:1}
.selo{display:block;margin:22px auto 0;width:132px;height:132px}
.celebra .selo{position:relative;z-index:2;width:112px;height:112px;margin-top:18px;opacity:0;animation:show .6s 2.4s forwards}
body.blindado .celebra>*,body.blindado .vitrine>*,body.blindado .v3d>*{filter:blur(22px) brightness(.6);transition:filter .1s}
.aviso-print{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(5,5,5,.85);color:#fff;text-align:center;padding:30px;font-weight:800;font-size:20px;animation:fade .15s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{transform:translateY(20px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes show{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"><div class="loading"><div><div class="spin"></div><p class="muted">Carregando…</p></div></div></div>
<div id="layer"></div>

<script>
(() => {
"use strict";
const $app = document.getElementById("app");
const $layer = document.getElementById("layer");

/* ---------- utilidades ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (k, n) => { const d = parseKey(k); return keyOf(new Date(d.getFullYear(), d.getMonth(), d.getDate()+n)); };
const diffDays = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 86400000);
const todayKey = () => keyOf(new Date());
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const fmtDate = k => { const d = parseKey(k); return `${d.getDate()} ${MESES[d.getMonth()]}`; };
const fmtTime = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const newId = () => "m" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const ss = { get(k){ try{return sessionStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{sessionStorage.setItem(k,v)}catch(e){} }, del(k){ try{sessionStorage.removeItem(k)}catch(e){} } };


const ICON = {
  target:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>',
  chev:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
  back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>',
  plus:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  trash:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>'
};

/* ---------- medalhas (graduações do jiu-jítsu) ---------- */

const writeChains = {};
function queueWrite(id, fn){
  const prev = writeChains[id] || Promise.resolve();
  const next = prev.then(fn, fn);
  writeChains[id] = next.catch(()=>{});

function dbErr(e){
  const c = e && e.code;

/* ---------- cálculo das metas ---------- */
function calc(m){
  const hoje = todayKey();
  const total = m.dias || 1;
  const checks = m.checks || {};
  let feitos = 0, falhas = 0;
  for (let i=0;i<total;i++){
    const k = addDays(m.inicio, i);
    if (checks[k]) feitos++;
    else if (k < hoje) falhas++;
  }
  const fim = addDays(m.inicio, total-1);
  const idxHoje = diffDays(m.inicio, hoje);
  const hojeNaMeta = idxHoje >= 0 && idxHoje < total;
  // sequência atual
  let seq = 0;
  let k = checks[hoje] ? hoje : addDays(hoje, -1);
  while (k >= m.inicio && k <= fim && checks[k]) { seq++; k = addDays(k, -1); }
  const restantes = Math.max(0, diffDays(hoje, fim) + (hojeNaMeta && !checks[hoje] ? 1 : 0) - (hojeNaMeta && !checks[hoje] ? 0 : 0));
  const encerrada = hoje > fim;
  const naoComecou = hoje < m.inicio;
  // dias seguidos sem nenhum ponto (até ontem, ou até o fim da meta)
  let gap = 0, gapKey = null;
  if (!checks[hoje]){
    let g = addDays(hoje, -1); if (g > fim) g = fim;
    while (g >= m.inicio && !checks[g]) { gap++; gapKey = g; g = addDays(g, -1); }
  }
  return { total, feitos, falhas, seq, fim, hoje, hojeNaMeta, idxHoje, encerrada, naoComecou, gap, gapKey,
    restantes: naoComecou ? total : Math.max(0, diffDays(hoje, fim)),
    pct: Math.round(feitos/total*100), batidoHoje: !!checks[hoje],
    vacilos: Object.keys(m.vacilos||{}).filter(x => m.vacilos[x] && !checks[x] && x >= m.inicio && x <= fim).length,
    vacilouHoje: !!((m.vacilos||{})[hoje] && !checks[hoje]) };
}

/* ---------- regras de exclusão ---------- */
const LIMITE = 10;
function situacao(m){
  if (m.tipo === "calendario"){
    const c = calc(m);
    const cumprida = c.encerrada;
    const perdida = !!m.perdida;
    const parada = !cumprida && !perdida && c.gap >= LIMITE;
    return { cumprida, perdida, parada, dias: c.gap, gapKey: c.gapKey, conversou: conversou(m, c.gapKey) };
  }
  const dias = m.concluida ? 0 : diffDays(keyOf(new Date(m.criadaEm || Date.now())), todayKey());
  const parada = !m.concluida && dias >= LIMITE;
  return { cumprida: !!m.concluida, parada, dias, gapKey: "criada", conversou: conversou(m, "criada") };
}
function conversou(m, gapKey){
  const cv = m.conversa;
  return !!(cv && gapKey && cv.gapKey === gapKey && Array.isArray(cv.msgs) && cv.msgs.some(x => x.r === "user"));
}
const podeExcluir = s => s.cumprida || s.perdida || (s.parada && s.conversou);
const MAX_VACILOS = 10;

function blocoExcluir(m){
  const s = situacao(m);
  if (podeExcluir(s)) return `<button class="btn ghost" style="margin-top:18px;color:var(--miss)" data-act="excluir">${ICON.trash} Excluir meta</button>`;
  if (s.parada) return `<div class="card" style="margin-top:14px;border:2px solid var(--today)">
      <p style="font-weight:800">💬 ${s.dias} dias sem ${m.tipo==="calendario"?"bater ponto":"avançar"}</p>
      <p class="small muted" style="margin-top:4px">Antes de qualquer decisão, vamos entender o que aconteceu.</p>
      <button class="btn" style="margin-top:12px" data-act="chat">Vamos conversar</button></div>`;
  return `<p class="small muted" style="text-align:center;margin-top:20px">🔒 Esta meta só pode ser excluída depois de cumprida${m.tipo==="calendario" ? `, ou após ${LIMITE} dias seguidos sem bater ponto` : ""}.</p>`;
}

/* ---------- conquista de medalhas e faixas ---------- */
function melhorSeq(m){
  const ch = m.checks || {}; let best = 0, run = 0;
  const hoje = todayKey();
  for (let i=0;i<(m.dias||0);i++){ const k = addDays(m.inicio, i); if (k > hoje) break; if (ch[k]) { run++; if (run > best) best = run; } else run = 0; }
  return best;
}
const medalId = (m, i) => `${m.id}-${m.inicio}-${MARCOS[i].d}`;
const medalhasDa = m => S.medalhas.filter(x => x.metaId === m.id && x.inicio === m.inicio).sort((a,b) => a.marco - b.marco);
function totalDias(){
  let t = (S.conta && S.conta.diasArquivados) || 0;
  for (const m of S.metas) if (m.tipo === "calendario" && !m.teste) t += calc(m).feitos;
  return t;
}
function graduacao(total = totalDias()){
  let i = 0; for (let k=0;k<TIERS.length;k++) if (total >= TIERS[k].min) i = k;
  const prox = TIERS[i+1];
  const ini = TIERS[i].min, fim = prox ? prox.min : null;
  const frac = prox ? (total - ini) / (fim - ini) : 1;
  const graus = prox ? Math.min(4, Math.floor(frac * 5)) : 4;
  return { idx:i, nome:TIERS[i].nome, graus, total, prox, faltam: prox ? fim - total : 0, frac };
}
async function arquivarDias(m){
  if (m.tipo !== "calendario" || m.teste) return;
  const f = calc(m).feitos; if (!f) return;
  const novo = ((S.conta && S.conta.diasArquivados) || 0) + f;
  await S.contaRef.update({ diasArquivados: novo });
  S.conta = { ...S.conta, diasArquivados: novo };
}
const concedendo = new Set();
let faixaPendente = false;
async function verificarMedalhas(){
  if (!S.metasFresh || !S.medFresh || !S.contaFresh || !S.medCol) return;
  if (S.metas.some(x => x.teste) || S.medalhas.some(x => x.teste) || (S.conta && S.conta.diasTeste)) { await limparTestes(); return; }
  const g = graduacao();
  for (const m of S.metas){
    if (m.tipo !== "calendario") continue;
    const best = melhorSeq(m);
    for (let i=0;i<MARCOS.length;i++){
      const mk = MARCOS[i];
      if (mk.d > best || mk.d > m.dias) break;
      const k = medalId(m, i);
      if (S.medalhas.some(x => x.id === k) || concedendo.has(k)) continue;
      concedendo.add(k);
      const med = { marco:i, faixa:g.idx, teste:!!m.teste, metaId:m.id, inicio:m.inicio, titulo:m.titulo, emoji:m.emoji||"🎯", em:todayKey(), ts:Date.now() };
      try { await S.medCol.doc(k).set(med); enfileirar(med); }
      catch(e){ concedendo.delete(k); toast(dbErr(e)); }
    }
  }
  const vista = (S.conta && S.conta.faixaVista) || 0;
  if (g.idx > vista && !faixaPendente){
    faixaPendente = true;
    try { await S.contaRef.update({ faixaVista: g.idx }); S.conta = { ...S.conta, faixaVista: g.idx }; enfileirar({ kind:"faixa", faixa:g.idx, total:g.total }); }
    catch(e){}
    faixaPendente = false;
  }
}

function salvarConversa(){
  const c = chat; if (!c) return;
  const msgs = c.msgs.slice(-40);
  queueWrite(c.id, () => S.metasCol.doc(c.id).update({ conversa: { gapKey: c.gapKey, msgs, em: Date.now() } })).catch(e => toast(dbErr(e)));
}
function enviarChat(){
  if (!chat || chat.busy) return;
  const txt = (chat.rascunho || "").trim();
  if (!txt) return;
  chat.msgs.push({ r:"user", c:txt, t:Date.now() });
  chat.rascunho = "";
  salvarConversa();
  responder();
}
async function responder(){
  const m = S.metas.find(x => x.id === chat.id); if (!m) return;
  const s = situacao(m);
  const c = chat;
  c.busy = true; c.streaming = ""; c.erro = ""; drawChat();
  if (!SAMPLE){
    // sem acesso ao Claude: perguntas fixas
    const nUser = c.msgs.filter(x => x.r === "user").length;
    const PERGUNTAS = [
      `Oi, ${S.conta.usuario}. Faz ${s.dias} dias que você não ${m.tipo==="calendario"?"bate o ponto":"avança"} em **${m.titulo}**. O que aconteceu? Me conta por que não tem conseguido cumprir essa meta.`,
      "Entendi. Essa meta ainda faz sentido pra você hoje? Por quê?",
      "E o que poderia te ajudar a voltar — mudar o horário, diminuir o tamanho da meta, pedir apoio de alguém?",
      "Valeu por responder com sinceridade. Agora a decisão é sua: **recomeçar hoje**, **continuar como está** ou **excluir a meta**, nos botões abaixo."
    ];
    const fixo = PERGUNTAS[Math.min(nUser, PERGUNTAS.length-1)];
    c.msgs.push({ r:"assistant", c:fixo, t:Date.now() }); c.busy = false;
    salvarConversa(); return drawChat();
  }
  const turns = [{ role:"user", content: regras(m, s) + (c.msgs.length ? "" : "\n\nComece você a conversa agora: cumprimente pelo nome e pergunte, com carinho, o que aconteceu.") }];
  for (const x of c.msgs) turns.push({ role: x.r === "user" ? "user" : "assistant", content: x.c });
  if (turns[turns.length-1].role !== "user") turns.push({ role:"user", content:"(continue)" });
  c.ctl = new AbortController();
  try {
    const { text } = await SAMPLE(turns, { cache:false, signal:c.ctl.signal, onText: ({ text }) => {
      c.streaming = text; const el = document.getElementById("stream"); if (el && chat === c){ el.innerHTML = fmtMsg(text); const b=document.getElementById("msgs"); b.scrollTop=b.scrollHeight; }
    }});
    c.msgs.push({ r:"assistant", c:text, t:Date.now() });
    salvarConversa();
  } catch(e){
    if (e && e.text) { c.msgs.push({ r:"assistant", c:e.text, t:Date.now() }); salvarConversa(); }
    const code = e && e.code;
    if (code === "not_granted" || code === "sampling_disabled" || code === "not_declared" || code === "capability_disabled" || code === "capability_removed"){
      SAMPLE = null; c.busy = false; return responder();
    }
    if (code !== "cancelled") c.erro = code === "rate_limited" ? "O Claude está ocupado agora. Tente de novo em alguns minutos." : "A resposta não chegou. Envie sua mensagem de novo.";
  }
  c.busy = false; c.streaming = "";
  if (chat === c) drawChat();
}
async function recomecar(m){
  const doc = { ...m }; delete doc.id;
  doc.inicio = todayKey(); doc.checks = {}; doc.vacilos = {}; doc.conversa = null; doc.perdida = null;
  if (m.tipo !== "calendario"){ doc.criadaEm = Date.now(); doc.concluida = false; }
  try { await arquivarDias(m); await queueWrite(m.id, () => S.metasCol.doc(m.id).set(doc)); chat = null; fechar(); toast("Meta recomeçada hoje. Bora! 💪"); }
  catch(e){ toast(dbErr(e)); }
}

// o servidor nunca recebe a senha: recebe só um "segredo" derivado dela (diferente da chave de criptografia)
async function segredoLogin(usuario, senha){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name:"PBKDF2", salt:new TextEncoder().encode("minhas-metas-login:" + usuario), iterations:150000, hash:"SHA-256" }, base, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2,"0")).join("");
}

/* ---------- criptografia (AES-GCM com chave derivada da senha) ---------- */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
let CHAVE = null;
async function derivarChave(senha, saltB64){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt: unb64(saltB64), iterations: 310000, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, true, ["encrypt","decrypt"]);
}
async function cifrar(obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, CHAVE, new TextEncoder().encode(JSON.stringify(obj)));
  return { dados: b64(ct), iv: b64(iv) };
}
async function decifrar(dados, iv){
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv: unb64(iv) }, CHAVE, unb64(dados));
  return JSON.parse(new TextDecoder().decode(pt));
}

}

const deepMerge = (alvo, patch) => {
  const out = Array.isArray(alvo) ? alvo.slice() : { ...(alvo || {}) };
  for (const [k, v] of Object.entries(patch)){
    out[k] = (v && typeof v === "object" && !Array.isArray(v) && out[k] && typeof out[k] === "object" && !Array.isArray(out[k])) ? deepMerge(out[k], v) : v;
  }
  return out;
};
const Banco = {
  uid:null, perfil:null, conta:{}, cache:{ metas:new Map(), medalhas:new Map() }, ouvintes:{ metas:new Set(), medalhas:new Set(), conta:new Set() }, filas:{},

    const r = await rpc("carregar", { p_token: TOKEN });

    let extra = {};

    this.conta = { ...extra, usuario: r.conta ? r.conta.usuario : "" };

    const docs = [...this.cache[col].entries()].map(([id, v]) => ({ id, exists:true, data:() => v }));
    const snap = { docs, size:docs.length, empty:!docs.length, metadata:{ fromCache:false, hasPendingWrites:false } };
    this.ouvintes[col].forEach(f => f(snap));
  },
  fila(chave, fn){ const prev = this.filas[chave] || Promise.resolve(); const nx = prev.then(fn, fn); this.filas[chave] = nx.catch(()=>{}); return nx; },
  async salvarItem(col, id){
    const v = this.cache[col].get(id);
    if (!v) return;
    const enc = await cifrar(v);
    await rpc("salvar_item", { p_token:TOKEN, p_colecao:col, p_id:id, p_dados:enc.dados, p_iv:enc.iv });
  },
  async salvarConta(){

  }
};
function colecaoRef(col){
  const ref = {
    orderBy(){ return ref; },
    onSnapshot(next){ Banco.ouvintes[col].add(next); queueMicrotask(() => Banco.avisar(col)); return () => Banco.ouvintes[col].delete(next); },
    doc(id){ return {
      id,
      async get(){ const v = Banco.cache[col].get(id); return { id, exists:!!v, data:() => v }; },
      set(v){ Banco.cache[col].set(id, JSON.parse(JSON.stringify(v))); Banco.avisar(col); return Banco.fila(col+id, () => Banco.salvarItem(col, id)); },
      update(patch){
        const atual = Banco.cache[col].get(id);
        if (!atual) return Promise.reject({ code:"invalid_argument" });
        Banco.cache[col].set(id, deepMerge(atual, JSON.parse(JSON.stringify(patch)))); Banco.avisar(col);
        return Banco.fila(col+id, () => Banco.salvarItem(col, id));
      },
      delete(){ Banco.cache[col].delete(id); Banco.avisar(col); return Banco.fila(col+id, () => rpc("apagar_item", { p_token:TOKEN, p_colecao:col, p_id:id })); }
    }; }
  };
  return ref;
}
const contaRef = {
  async get(){ return { exists:true, data:() => ({ ...Banco.conta }) }; },
  update(patch){ Banco.conta = deepMerge(Banco.conta, patch); Banco.avisar("conta"); return Banco.fila("conta", () => Banco.salvarConta()); },
  onSnapshot(next){ Banco.ouvintes.conta.add(next); queueMicrotask(() => Banco.avisar("conta")); return () => Banco.ouvintes.conta.delete(next); },
  collection(c){ return colecaoRef(c); }
};

    const lembrar = !!document.getElementById("lembrar")?.checked;
    lsSet("mm_lembrar", lembrar ? "1" : "0");
    await guardarChaveSessao(lembrar);
    try { localStorage.setItem("mm_u", u); } catch(e){}
    await Banco.carregar();
    S.conta = { ...Banco.conta }; S.erro = "";
    entrar();
  } catch(e){ fail("Sem conexão com o servidor. Tente de novo."); }
}

    <div class="card">
      <div class="hero">

function blocoMedalha(m){
  if (m.tipo !== "calendario") return "";
  const ganhas = medalhasDa(m), c = calc(m);
  const prox = MARCOS.find((mk, i) => mk.d <= m.dias && !ganhas.some(x => x.marco === i));
  if (!ganhas.length && !prox) return "";
  return `<div class="card" style="margin-top:14px;background:linear-gradient(135deg,#1a1408,#3a2c0c);color:#fff">
    <div class="small" style="letter-spacing:.2em;font-weight:800;color:#F4D27A">MEDALHAS DESTE DESAFIO</div>
    ${ganhas.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${ganhas.map(x => `<button data-act="ver3d" data-mid="${esc(x.id)}" aria-label="${esc(MARCOS[x.marco].nome)}">${medalDuo(x.faixa, { marco:x.marco, size:52, anim:false })}</button>`).join("")}</div>` : ""}
    ${prox ? `<p class="small" style="margin-top:10px;opacity:.85;font-weight:600">Próxima: <b>${esc(prox.nome)}</b> seguidos · faltam ${Math.max(1, prox.d - c.seq)} dia${prox.d - c.seq === 1 ? "" : "s"} na sequência atual (🔥 ${c.seq})</p>` : `<p class="small" style="margin-top:10px;opacity:.85;font-weight:700">Todas as medalhas deste desafio conquistadas! 🏆</p>`}
  </div>`;
}
function autoChat(m){
  const s = situacao(m);
  const chave = m.id + ":" + s.gapKey;
  if (s.parada && !s.conversou && !chat && !autoAberto.has(chave)){ autoAberto.add(chave); setTimeout(() => abrirChat(m), 400); }
}

/* ---------- ações ---------- */
async function marcarDia(m, k){
  const atual = (m.checks||{})[k];
  if (!atual && (m.vacilos||{})[k]){
    return confirmar(`Trocar o vacilo de ${fmtDate(k)} por ponto?`, "O vacilo desse dia será apagado e o dia conta como cumprido.", "Trocar", () =>
      queueWrite(m.id, () => S.metasCol.doc(m.id).update({ checks:{ [k]: Date.now() }, vacilos:{ [k]: null }, perdida: null })).catch(e => toast(dbErr(e))));
  }
  if (atual && k !== todayKey()){
    return confirmar(`Desmarcar ${fmtDate(k)}?`, "O ponto desse dia será removido.", "Desmarcar", () => gravarDia(m, k, false));
  }
  if (atual && k === todayKey()){
    return confirmar("Desfazer o ponto de hoje?", "Você pode bater de novo depois.", "Desfazer", () => gravarDia(m, k, false));
  }
  gravarDia(m, k, Date.now());
  if (k === todayKey()) toast(`Ponto batido · ${fmtTime(Date.now())} 💪`);
}
function gravarDia(m, k, val){
  queueWrite(m.id, () => S.metasCol.doc(m.id).update({ checks: { [k]: val } })).catch(e => toast(dbErr(e)));
}

function confirmar(titulo, texto, botao, onOk){
  $layer.innerHTML = `<div class="overlay" data-act="fechar"><div class="sheet">
    <div class="grab"></div><h2 style="font-size:22px">${esc(titulo)}</h2><p class="muted" style="margin-top:6px">${esc(texto)}</p>
    <div class="row2" style="margin-top:20px"><button class="btn ghost" data-act="fechar">Cancelar</button><button class="btn danger" id="okBtn">${esc(botao)}</button></div>
  </div></div>`;
  document.getElementById("okBtn").onclick = () => { fechar(); onOk(); };
}
function fechar(){ $layer.innerHTML = ""; }

function abrirEditar(m){
  let emoji = m.emoji || "🎯";
  const draw = () => {
    $layer.innerHTML = `<div class="overlay" data-act="fechar"><div class="sheet">
      <div class="grab"></div>
      <h2 style="font-size:24px">Editar meta</h2>
      <form id="fEd">
        <label for="et">Nome da meta</label>
        <input id="et" required maxlength="80" value="${esc(m.titulo)}">
        <label>Ícone</label>
        <div class="emojis">${EMOJIS.map(e => `<button type="button" data-emo="${e}" class="${emoji===e?"on":""}">${e}</button>`).join("")}</div>
        <p class="small muted" style="margin-top:12px">Duração, data de início e pontos não mudam.</p>
        <div class="err" id="eerr"></div>
        <div class="row2" style="margin-top:8px"><button type="button" class="btn ghost" data-act="fechar">Cancelar</button><button class="btn" type="submit">Salvar</button></div>
      </form></div></div>`;
    $layer.querySelectorAll("[data-emo]").forEach(b => b.onclick = () => { const v = document.getElementById("et").value; emoji = b.dataset.emo; draw(); document.getElementById("et").value = v; });
    document.getElementById("fEd").onsubmit = async ev => {
      ev.preventDefault();
      const titulo = document.getElementById("et").value.trim();
      if (!titulo){ document.getElementById("eerr").textContent = "Dê um nome para a meta."; return; }
      if (titulo === m.titulo && emoji === (m.emoji || "🎯")) return fechar();
      fechar();
      try {
        await queueWrite(m.id, () => S.metasCol.doc(m.id).update({ titulo, emoji }));
        for (const x of S.medalhas.filter(x => x.metaId === m.id)) await S.medCol.doc(x.id).update({ titulo, emoji });
        toast("Meta atualizada ✓");
      } catch(e){ toast(dbErr(e)); }
    };
  };
  draw();
  setTimeout(() => { const i = document.getElementById("et"); if (i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 80);
}

function abrirVacilei(m){
  const n = calc(m).vacilos + 1;
  const perde = n > MAX_VACILOS, ultimo = n === MAX_VACILOS;
  const aviso = perde
    ? `<div style="margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--miss);color:#fff;font-weight:700">💔 Esse seria o ${n}º vacilo. O limite é ${MAX_VACILOS} — se confirmar, a meta será perdida.</div>`
    : `<div style="margin-top:12px;padding:10px 14px;border-radius:12px;background:${ultimo ? "var(--today-soft)" : "var(--bg)"};font-weight:700">Vacilo ${n} de ${MAX_VACILOS}${ultimo ? " — ⚠️ é o último permitido. O próximo faz você perder a meta." : n >= MAX_VACILOS - 2 ? " — atenção, tá chegando no limite." : ""}</div>`;
  $layer.innerHTML = `<div class="overlay" data-act="fechar"><div class="sheet">
    <div class="grab"></div>
    <div style="font-size:40px">😬</div>
    <h2 style="font-size:24px;margin-top:6px">Vacilou? Acontece.</h2>
    <p class="muted" style="margin-top:6px">O ponto de hoje sai e o dia fica marcado como vacilo. A sequência zera, mas a meta continua — o que importa é voltar amanhã.</p>
    ${aviso}
    <label for="vn">O que rolou? <span class="muted" style="font-weight:500">(opcional)</span></label>
    <textarea id="vn" rows="2" maxlength="200" placeholder="Ex.: estresse no trabalho, saí com os amigos…"></textarea>
    <div class="row2" style="margin-top:18px"><button class="btn ghost" data-act="fechar">Cancelar</button><button class="btn danger" id="vOk">${perde ? "Registrar e perder a meta" : "Registrar vacilo"}</button></div>
  </div></div>`;
  document.getElementById("vOk").onclick = () => {
    const nota = document.getElementById("vn").value.trim();
    const k = todayKey(), ponto = (m.checks||{})[k] || null;
    fechar();
    const upd = { checks:{ [k]: false }, vacilos:{ [k]: { ts: Date.now(), nota, ponto } } };
    if (perde) upd.perdida = { em: k, ts: Date.now(), vacilos: n };
    queueWrite(m.id, () => S.metasCol.doc(m.id).update(upd))
      .then(() => toast(perde ? "Meta perdida. Respira — dá pra recomeçar. 💔" : ultimo ? "Último vacilo usado. Agora é sem falhar 💪" : "Registrado. Amanhã é um novo dia 💪")).catch(e => toast(dbErr(e)));
  };
}

const EMOJIS = ["🚭","🎯","💪","🏃","💧","📚","🥗","💰","🧘","😴","🚫","⭐"];
function abrirNova(){
  const f = { tipo:"calendario", titulo:"", dias:60, inicio: todayKey(), emoji:"🚭", motivo:"" };
  const draw = () => {
    $layer.innerHTML = `<div class="overlay" data-act="fechar"><div class="sheet">
      <div class="grab"></div>
      <h2 style="font-size:24px">Nova meta</h2>
      <form id="fNova">
        <label>Tipo</label>
        <div class="seg">
          <button type="button" data-tipo="calendario" class="${f.tipo==="calendario"?"on":""}">📅 Calendário<small>Bater ponto todo dia</small></button>
          <button type="button" data-tipo="simples" class="${f.tipo==="simples"?"on":""}">✅ Única<small>Concluir uma vez</small></button>
        </div>
        <label for="nt">Nome da meta</label>
        <input id="nt" required maxlength="80" placeholder="${f.tipo==="calendario"?"Ex.: 60 dias sem fumar":"Ex.: Tirar a CNH"}" value="${esc(f.titulo)}">
        <label>Ícone</label>
        <div class="emojis">${EMOJIS.map(e=>`<button type="button" data-emo="${e}" class="${f.emoji===e?"on":""}">${e}</button>`).join("")}</div>
        ${f.tipo==="calendario" ? `
        <label>Duração</label>
        <div class="chips">${[7,21,30,60,90,180,365].map(n=>`<button type="button" data-dias="${n}" class="${f.dias===n?"on":""}">${n} dias</button>`).join("")}</div>
        <div class="row2">
          <div><label for="nd">Dias (personalizado)</label><input id="nd" type="number" min="1" max="1000" inputmode="numeric" value="${f.dias}"></div>
          <div><label for="ni">Começa em</label><input id="ni" type="date" value="${f.inicio}"></div>
        </div>` : ""}
        <label for="nm">Por que essa meta? <span class="muted" style="font-weight:500">(opcional)</span></label>
        <textarea id="nm" rows="2" maxlength="300" placeholder="Ex.: Pela minha saúde e pela minha família">${esc(f.motivo)}</textarea>
        <div class="err" id="nerr"></div>
        <button class="btn" type="submit" style="margin-top:8px">Criar meta</button>
      </form>
    </div></div>`;
    const sync = () => {
      f.titulo = document.getElementById("nt").value;
      f.motivo = document.getElementById("nm").value;
      const nd = document.getElementById("nd"), ni = document.getElementById("ni");
      if (nd) f.dias = parseInt(nd.value,10) || f.dias;
      if (ni && ni.value) f.inicio = ni.value;
    };
    $layer.querySelectorAll("[data-tipo]").forEach(b => b.onclick = () => { sync(); f.tipo = b.dataset.tipo; draw(); });
    $layer.querySelectorAll("[data-emo]").forEach(b => b.onclick = () => { sync(); f.emoji = b.dataset.emo; draw(); });
    $layer.querySelectorAll("[data-dias]").forEach(b => b.onclick = () => { sync(); f.dias = +b.dataset.dias; draw(); });
    document.getElementById("fNova").onsubmit = async ev => {
      ev.preventDefault(); sync();
      const err = document.getElementById("nerr");
      const titulo = f.titulo.trim();
      if (!titulo) { err.textContent = "Dê um nome para a meta."; return; }
      if (f.tipo==="calendario" && (!(f.dias>=1) || f.dias>1000)) { err.textContent = "A duração deve ser entre 1 e 1000 dias."; return; }
      const id = newId();
      const doc = f.tipo==="calendario"
        ? { tipo:"calendario", titulo, emoji:f.emoji, motivo:f.motivo.trim(), dias:f.dias, inicio:f.inicio, checks:{}, criadaEm:Date.now() }
        : { tipo:"simples", titulo, emoji:f.emoji, motivo:f.motivo.trim(), concluida:false, criadaEm:Date.now() };
      const btn = ev.target.querySelector("button[type=submit]"); btn.disabled = true;
      try { await S.metasCol.doc(id).set(doc); }
      catch(e){ err.textContent = dbErr(e); btn.disabled = false; return; }
      fechar(); S.metaId = id; S.view = "meta"; render(); toast("Meta criada!");
    };
  };
  draw();
}

/* ---------- proteção das medalhas ---------- */
const temMedalhaNaTela = () => !!document.querySelector(".celebra, .vitrine, .v3d");
["contextmenu","dragstart","selectstart","copy"].forEach(t => document.addEventListener(t, e => { if (e.target.closest && e.target.closest(".protegido")) e.preventDefault(); }));
function blindar(on){ document.body.classList.toggle("blindado", on); }
document.addEventListener("visibilitychange", () => { if (document.hidden) blindar(true); else setTimeout(() => blindar(false), 350); });
window.addEventListener("blur", () => blindar(true));
window.addEventListener("focus", () => setTimeout(() => blindar(false), 350));
function avisoPrint(){
  if (!temMedalhaNaTela() || document.querySelector(".aviso-print")) return;
  blindar(true);
  const a = document.createElement("div"); a.className = "aviso-print";
  a.innerHTML = `<div><div style="font-size:54px">🥋</div><p style="margin-top:10px">Opa! Nada de print.</p><p style="font-weight:600;font-size:15px;opacity:.8;margin-top:8px">Medalha não se copia — se conquista.</p></div>`;
  document.body.appendChild(a);
  setTimeout(() => { a.remove(); blindar(false); }, 2200);
}
document.addEventListener("keyup", e => { if (e.key === "PrintScreen") { try { navigator.clipboard.writeText("Medalha não se copia — se conquista. Oss! 🥋"); } catch(_){} avisoPrint(); } });
document.addEventListener("keydown", e => {
  const k = (e.key || "").toLowerCase();
  if (e.key === "PrintScreen" || ((e.ctrlKey || e.metaKey) && (k === "p" || k === "s")) || (e.metaKey && e.shiftKey && ["3","4","5","s"].includes(k))) {
    if (temMedalhaNaTela()) { e.preventDefault(); avisoPrint(); }
  }
});

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "fechar"){ if (ev.target === el || el.tagName === "BUTTON"){ fechar(); if (chat) drawChat(); } return; }
  if (act === "go"){ S.view = el.dataset.v; render(); window.scrollTo(0,0); return; }
  if (act === "sair") return sair();
  if (act === "criarConta"){ S.authMode = "criar"; S.erro=""; return render(); }
  if (act === "voltarLogin"){ S.authMode = "login"; S.erro=""; return render(); }
  if (act === "verFaixa"){ const g = graduacao(); celebrar({ kind:"faixa", faixa:g.idx, total:g.total, graus:g.graus }, true); return; }
  if (act === "ver3d"){
    if (el.dataset.mid){ const g = S.medalhas.find(x => x.id === el.dataset.mid); if (g) abrir3D({ marco:g.marco, faixa:g.faixa, med:g }); }
    else abrir3D({ marco:+el.dataset.marco, faixa:graduacao().idx, med:null });
    return;
  }
  if (act === "verMedalha"){ const g = S.medalhas.find(x => x.id === el.dataset.mid); if (g) celebrar(g, true); return; }
  if (act === "abrir"){ S.metaId = el.dataset.id; S.view = "meta"; render(); window.scrollTo(0,0); return; }
  if (act === "nova") return abrirNova();
  const m = S.metas.find(x => x.id === (chat ? chat.id : S.metaId));
  if (act === "chat" && m) return abrirChat(m);
  if (act === "fecharChat"){ if (chat && chat.ctl) chat.ctl.abort(); chat = null; fechar(); render(); return; }
  if (act === "pararChat"){ if (chat && chat.ctl) chat.ctl.abort(); return; }
  if (act === "recomecar" && m){
    return confirmar("Recomeçar do zero hoje?", m.tipo==="calendario" ? `A contagem de ${m.dias} dias volta para o dia 1, começando hoje.` : "A meta volta a contar a partir de hoje.", "Recomeçar", () => recomecar(m));
  }
  if (act === "excluir" && m && !podeExcluir(situacao(m))){ toast("Esta meta ainda não pode ser excluída 🔒"); return; }
  if (act === "vacilei" && m) return abrirVacilei(m);
  if (act === "editarMeta" && m) return abrirEditar(m);
  if (act === "instalar") return instalar();
  if (act === "naoInstalar"){ lsSet("mm_sem_instalar", String(Date.now())); render(); return; }
  if (act === "desfazerVacilo" && m){
    const k = todayKey(), antes = (m.vacilos||{})[k];
    return confirmar("Desfazer o vacilo de hoje?", "O ponto de hoje volta a ficar batido.", "Desfazer", () =>
      queueWrite(m.id, () => S.metasCol.doc(m.id).update({ checks:{ [k]: (antes && antes.ponto) || Date.now() }, vacilos:{ [k]: null }, perdida: null })).catch(e => toast(dbErr(e))));
  }
  if (act === "dia" && m){ if (!el.disabled) marcarDia(m, el.dataset.k); return; }
  if (act === "toggleUnica" && m){
    const val = !m.concluida;
    queueWrite(m.id, () => S.metasCol.doc(m.id).update({ concluida: val, concluidaEm: val ? todayKey() : null })).catch(e=>toast(dbErr(e)));
    if (val) toast("Parabéns! 🎉");
    return;
  }
  if (act === "excluir" && m){
    return confirmar(`Excluir “${m.titulo}”?`, "Todo o histórico dessa meta será apagado. Não dá para desfazer.", "Excluir", async () => {
      try { await arquivarDias(m); await S.metasCol.doc(m.id).delete(); chat = null; S.view = "metas"; render(); toast("Meta excluída"); }
      catch(e){ toast(dbErr(e)); }
    });
  }
});

// atualiza "hoje" quando o dia vira com a página aberta
let ultimoDia = todayKey();
document.addEventListener("visibilitychange", () => { if (!document.hidden && todayKey() !== ultimoDia){ ultimoDia = todayKey(); if (S.logado) render(); } });

/* ---------- limpeza única dos dados criados pela antiga aba de testes ---------- */
let limpandoTestes = false;
async function limparTestes(){
  if (limpandoTestes) return; limpandoTestes = true;
  try {
    for (const m of S.metas.filter(x => x.teste)) await S.metasCol.doc(m.id).delete();
    for (const x of S.medalhas.filter(x => x.teste)) await S.medCol.doc(x.id).delete();
    const dt = (S.conta.diasTeste)||0;
    const arq = Math.max(0, ((S.conta.diasArquivados)||0) - dt);
    S.conta = { ...S.conta, diasArquivados: arq, diasTeste: 0 };
    const real = graduacao().idx; // já sem os testes
    await S.contaRef.update({ diasArquivados: arq, diasTeste: 0, faixaVista: real });
    S.conta.faixaVista = real;
    render();
  } catch(e){} finally { limpandoTestes = false; }
}

/* ---------- só celular ---------- */
const Disp = {
  info(){
    const ua = navigator.userAgent || "";
    const plat = navigator.platform || "";
    const toques = navigator.maxTouchPoints || 0;
    const grosso = matchMedia("(pointer:coarse)").matches;
    const fino = matchMedia("(any-pointer:fine)").matches && matchMedia("(hover:hover)").matches;
    const uaCel = /iPhone|iPod|Android.+Mobile|Mobile.+Firefox|Windows Phone/i.test(ua);
    const tablet = /iPad|Tablet|PlayBook|Silk|Kindle/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua)) || (/Mac/.test(plat) && toques > 1);
    const ladoMenor = Math.min(screen.width, screen.height);
    const uad = navigator.userAgentData;
    // sinais de celular simulado no computador (DevTools / modo responsivo)
    const sinais = [];
    if (uaCel && /Win|Mac|x86_64|i686/i.test(plat) && !/arm|aarch/i.test(plat)) sinais.push("plataforma");
    if (uaCel && uad && uad.platform && /Windows|macOS|Chrome OS/i.test(uad.platform)) sinais.push("ua-data");
    const lw = document.documentElement.clientWidth || window.innerWidth;
    if (uaCel && window.outerWidth && window.outerWidth - lw > 160) sinais.push("janela");
    if (uaCel && toques === 0) sinais.push("sem-toque");
    if (uaCel && fino && !grosso) sinais.push("mouse");
    const celular = uaCel && !tablet && grosso && toques > 0 && ladoMenor < 600 && !sinais.length;
    return { celular, tablet, simulado: sinais.length > 0, sinais };
  },
  marcar(){ try { localStorage.setItem("mm_viu_desktop", String(Date.now())); } catch(e){} },
  jaViuDesktop(){ try { const t = +localStorage.getItem("mm_viu_desktop"); return t && Date.now() - t < 10*60000; } catch(e){ return false; } },
  bloquear(tipo){
    if (document.querySelector(".bloqueio")) { if (tipo !== "simulacao") return; document.querySelector(".bloqueio").remove(); }
    $app.innerHTML = ""; $layer.innerHTML = "";
    document.querySelectorAll(".celebra,.aviso-print").forEach(x => x.remove());
    const end = location.href.split("#")[0];
    const b = document.createElement("div");
    b.className = "bloqueio" + (tipo === "simulacao" ? " alerta" : "");
    b.innerHTML = tipo === "simulacao"
      ? `<div><div style="font-size:60px">🚫</div><h1>Não vale simular celular</h1>
         <p>Percebemos que a tela foi alterada para parecer um celular dentro do computador. O Minhas Metas só pode ser usado <b>no seu celular de verdade</b>.</p>
         <p>Abra este endereço direto no celular:</p><div class="end">${esc(end.replace(/^https?:\/\//,""))}</div></div>`
      : `<div><div style="font-size:60px">📱</div><h1>Só no celular</h1>
         <p>O Minhas Metas foi feito para ser usado no celular. ${tipo === "tablet" ? "Tablets" : "Computadores"} não são permitidos.</p>
         <p>Abra este endereço no seu celular:</p><div class="end">${esc(end.replace(/^https?:\/\//,""))}</div></div>`;
    document.body.appendChild(b);
    S.bloqueado = true;
  },
  checar(){
    const d = this.info();
    if (d.celular){
      if (this.jaViuDesktop()){ this.bloquear("simulacao"); return false; }
      return true;
    }
    if (d.simulado){ this.bloquear("simulacao"); return false; }
    this.marcar();
    this.bloquear(d.tablet ? "tablet" : "computador");
    return false;
  }
};
// vigia: largura saindo de "computador" para "celular" na mesma aba = tentativa de simular
let larguraAnterior = window.innerWidth, alturaAnterior = window.innerHeight;
function vigiar(){
  const w = window.innerWidth, h = window.innerHeight;
  // tela "em pé" com 800px+ de largura não é celular; se encolheu para tamanho de celular, alguém mexeu na janela
  if (larguraAnterior >= 800 && larguraAnterior <= alturaAnterior * 1.05 && w < 600){ Disp.marcar(); Disp.bloquear("simulacao"); }
  else if (larguraAnterior >= 900 && w < 600 && !matchMedia("(pointer:coarse)").matches){ Disp.marcar(); Disp.bloquear("simulacao"); }
  else if (!S.bloqueado){ const d = Disp.info(); if (!d.celular) Disp.bloquear(d.simulado ? "simulacao" : d.tablet ? "tablet" : "computador"); }
  larguraAnterior = w; alturaAnterior = h;
}
window.addEventListener("resize", vigiar);
matchMedia("(pointer:coarse)").addEventListener?.("change", vigiar);
setInterval(() => { if (!S.bloqueado) vigiar(); }, 3000);

if (Disp.checar()) init();
})();
