<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 38%,#3a2c0c,#120e06 50%,#050505);color:#fff;font-family:Manrope}
canvas{width:100%;height:100%;display:block;touch-action:none}#b{position:fixed;top:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap}#b button{padding:6px 10px}</style></head>
<body><canvas id="c"></canvas><div id="b"></div>
<script type="module">
import { abrirVisualizador } from "./medalha3d.js?v=3";
const MARCOS=[["7 dias","bronze",0],["15 dias","prata",0],["30 dias","ouro",0],["60 dias","ouro",1],["90 dias","negro",1],["6 meses","rose",1],["1 ano","rubi",1]];
const FAIXAS=[["Faixa Azul",["#1F56B8"],"#141414"],["Faixa Preta",["#151515"],"#C8102E"],["Faixa Coral",["#C8102E","#151515"],"#F7F5EE"]];
let v=null; const q=new URLSearchParams(location.search);
async function abrir(i,f){ await document.fonts.ready; v&&v.fechar(); const [n,m,g]=MARCOS[i]; const [fn,co,po]=FAIXAS[f];
 v=abrirVisualizador(document.getElementById('c'),{marcoNome:n,metal:m,gemas:!!g,dias:60,faixaNome:fn,cores:co,pont:po,graus:2,dono:"lfbranquinho",codigo:"#A1B2-C3D4",titulo:"60 dias sem fumar",data:"9 nov 2026",bloqueada:false}); }
MARCOS.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x[0];b.onclick=()=>abrir(i,+q.get('f')||0);document.getElementById('b').append(b);});
abrir(+q.get('m')||3, +q.get('f')||0);
</script></body></html>
